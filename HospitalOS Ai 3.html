<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HospitalOS AI</title>
<style>

button,select,input,textarea{font:inherit;color:var(--ink)}

td{padding:8px;border-bottom:1px solid var(--bd);vertical-align:middle}tr.k{cursor:pointer}tr.k:hover{background:var(--bg)}td.n,th.n{text-align:right}

.tl{height:6px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.li{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.li small,.mut{color:var(--mut)}.sev{width:3px;align-self:stretch;border-radius:2px}

.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}.leg i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:2px}

.big{font-size:18px;padding:12px 16px}.lang{display:inline-flex}.menu{position:absolute;right:32px;top:48px;background:var(--w);border:1px solid var(--bd);border-radius:6px;padding:12px;z-index:5;display:none}
label{display:block;margin:8px 0 4px;font-size:13px}textarea,.fw{width:100%}
@media(max-width:860px){#app{display:block}nav{height:auto;position:static;display:flex;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--bd)}nav .logo,nav .tag{display:none}nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:2px solid transparent}nav button.on{border-bottom-color:var(--teal)}
main{padding:16px}.top{padding:8px 16px}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.bar{grid-template-columns:100px 1fr 56px}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes grow{from{transform:scaleX(0)}}@keyframes ring{from{stroke-dashoffset:113.1}}@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.12)}100%{transform:none;opacity:1}}@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}100%{box-shadow:0 0 0 7px transparent}}@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(340%)}}@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}}@keyframes rp{to{transform:translate(-50%,-50%) scale(14);opacity:0}}
main.anim>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}main.anim>*:nth-child(2){animation-delay:.05s}main.anim>*:nth-child(3){animation-delay:.1s}main.anim>*:nth-child(4){animation-delay:.15s}main.anim>*:nth-child(5){animation-delay:.2s}main.anim>*:nth-child(n+6){animation-delay:.25s}

.btn{position:relative;overflow:hidden;transition:transform .15s,border-color .2s,background .2s,filter .2s}.btn:active{transform:scale(.96)}.btn.p:hover{filter:brightness(1.1)}.rip{position:absolute;width:12px;height:12px;border-radius:50%;background:currentColor;opacity:.25;transform:translate(-50%,-50%);animation:rp .6s ease-out forwards;pointer-events:none}
nav button{transition:padding .2s,background .2s,color .2s}nav button:hover{padding-left:18px}.toast{animation:tin .3s ease}.pop{animation:pop .45s both}.bar:hover .tr i{filter:brightness(1.2)}.bar{transition:transform .2s}.bar:hover{transform:translateX(3px)}
.kpis div,.tile{transition:background .3s,transform .2s,border-color .2s}.kpis div:hover,.tile:hover{background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%),var(--mint),var(--w) 75%)}.bd.wn::before,.bd.er::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;animation:pulse 1.8s infinite}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:24px}.tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px 12px;height:auto;border-radius:6px}.tile:hover{transform:translateY(-3px);border-color:var(--teal)}.tile svg{width:64px;height:64px;transform:rotate(-90deg)}.tile b{font-size:16px}.tile .tip{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);font-size:11px;padding:3px;transform:translateY(100%);transition:transform .2s}.tile:hover .tip,.tile:focus-visible .tip{transform:none}
.lane{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.chip{border:1px solid var(--bd);background:var(--w);border-radius:4px;padding:0 8px;font-weight:600}.chip:first-child{border-color:var(--teal);color:var(--teal)}
.lamp{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--w);cursor:pointer;transition:all .25s}.lamp:hover{transform:scale(1.1)}.lamp.on{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 0 0 4px var(--mint)}
.scanbox{border:1px solid var(--bd);background:var(--w);border-radius:6px;padding:12px 16px;margin-bottom:24px;position:relative;overflow:hidden}.scanbox[hidden]{display:none}.scanbox::after{content:'';position:absolute;inset:0 auto 0 0;width:30%;background:linear-gradient(90deg,transparent,var(--mint),transparent);animation:sweep 1s linear infinite;opacity:.8}
@media(max-width:860px){.tiles{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
#px{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}#px svg{position:absolute;left:-6%;top:-6%;width:112%;height:150%;will-change:translate}#app>div{position:relative;z-index:1}#main>h1,#main>.sub{will-change:translate}

<script>
const NAV=[['ov','Overview'],['dp','Departments'],['qm','Queue Monitor'],['wa','Walk-in & Appointments'],['pa','Patient Assistance'],['fb','Feedback & Cleanliness'],['ag','AI Operations Agent'],['tc','Tasks & Complaints'],['rp','Reports & Analytics'],['st','Settings']];
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
let S,page='ov',q={d:'LAB',st:'All'},ds='',df='All',lang='en',ans=null,tok=null,ref=null;
function seed(){const D=[['GM','General Medicine','Block A, Ground floor, Room 12',3,3,4,240,60,150,41,70],['PED','Pediatrics','Block B, First floor, Room 4',2,2,3.5,140,40,100,18,30],['ORT','Orthopedics','Block A, First floor, Room 21',2,2,5,130,40,90,20,35],['LAB','Laboratory','Block C, Ground floor, Sample Collection Hall',2,3,2.75,170,50,100,44,58],['RAD','Radiology','Block C, Basement, X-ray & Ultrasound',2,2,6,90,30,60,12,15],['PHR','Pharmacy','Block A, Ground floor, near main entrance',3,3,2,180,80,100,52,85]];

d.forEach(x=>{const[s,w]=cf[x.c],T=s+1+w;for(let n=1;n<=T;n++)k.push({id:x.c+'-'+String(n).padStart(3,'0'),d:x.c,t:480+Math.round(n*162/T),s:n<=s?'Served':n==s+1?'Called':'Waiting'});qq[x.c]=T});
return{t:642,d,k,q:qq,act:[{t:628,x:'Token LAB-029 called to Counter 1',d:'LAB'},{t:631,x:'Counter 3 in Laboratory marked unavailable (staff break)',d:'LAB'},{t:636,x:'Token GM-063 marked served',d:'GM'}],
cm:[{id:'FB-1041',cat:'Washroom maintenance',loc:'Block A',tx:'Washroom tap not working near Room 14.',an:0,st:'In progress',team:'Facilities',t0:340,t1:360,t2:null,nt:''},{id:'FB-1042',cat:'Cleanliness',loc:'Pharmacy',tx:'Floor wet and unmarked near the counter.',an:1,st:'Submitted',team:'',t0:617,t1:null,t2:null,nt:''},{id:'FB-1043',cat:'Service delay',loc:'Laboratory',tx:'Long wait at sample collection.',an:0,st:'Resolved',team:'Front Desk',t0:500,t1:510,t2:560,nt:'Extra staff briefed at the hall.'}],
tk:[{id:'T-12',x:'Confirm Counter 3 staffing with Laboratory supervisor',o:'Lab supervisor',dn:0},{id:'T-13',x:'Restock waiting-area signage (Block C)',o:'Facilities',dn:1}],
hs:[],sn:[{t:642,x:'Initial seeded state',m:52,dp:'Laboratory'}],ag:null,rec:null,sel:'LAB',sel2:null,role:'Administrator',pol:20,hn:'District Government Hospital (Demo)',sc:1}}
S=seed();
const dep=c=>S.d.find(x=>x.c===c),wt=d=>S.k.filter(k=>k.d===d.c&&k.s==='Waiting'),est=d=>d.a>0?Math.round(wt(d).length*d.avg/d.a):null,E=v=>v==null?'—':v+' min';
const lbl=d=>d.st==='Closed'?['Closed','er']:d.st==='Limited'?['Limited service','wn']:(est(d)||0)>=45?['High wait','wn']:['Open','ok'];
const bg=d=>{const l=lbl(d);return`<span class="bd ${l[1]}">${l[0]}</span>`};

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
const adm=()=>S.role==='Administrator'||(toast('Viewer role: an administrator must do this.'),false);
function gen(c){const d=dep(c);if(d.st==='Closed'){toast(d.n+' is closed.');return null}if(d.wu>=d.wk){toast('Walk-in reserve is full for '+d.n+'. Please ask at the desk.');return null}
const n=++S.q[c],t={id:c+'-'+String(n).padStart(3,'0'),d:c,t:S.t,s:'Waiting'};S.k.push(t);d.wu++;log('Demo token '+t.id+' generated',c);return t}
function alerts(){const a=[];S.d.forEach(d=>{const w=est(d);if(w>=45)a.push({s:'er',x:d.n+' estimated waiting time is '+w+' min',l:d.n,t:S.t-8,b:'Analyze flow',g:'ag'});if(d.a<d.tot)a.push({s:'wn',x:(d.tot-d.a)+' service counter(s) unavailable',l:d.n,t:S.t-11,b:'Review counters',g:'dp',c:d.c})});
S.cm.filter(c=>c.st==='Submitted').forEach(c=>a.push({s:'wn',x:'Cleanliness/service report '+c.id+' needs assignment',l:c.loc,t:c.t0,b:'Assign',g:'tc'}));return a}
function bars(it,o={}){const mx=o.max||Math.max(1,...it.map(i=>i[1]));return it.map(i=>`<div class="bar"><span>${e(i[0])}</span><div class="tr tl" role="img" aria-label="${e(i[0])}: ${i[1]} ${o.u||''}"><i style="width:${Math.min(100,i[1]/mx*100)}%;background:${i[3]||'var(--teal)'}"></i></div><b class="n">${i[1]}${o.u||''}</b></div>`).join('')}

const P={
ov(){const w=S.d.reduce((a,d)=>a+wt(d).length,0),ev=S.d.map(est).filter(x=>x!=null).sort((a,b)=>a-b),md=ev[Math.floor(ev.length/2)],ac=S.d.reduce((a,d)=>a+d.a,0),to=S.d.reduce((a,d)=>a+d.tot,0),un=S.cm.filter(c=>c.st!=='Resolved').length,al=alerts();

`<div class="kpis"><div><span class="lab">Patients waiting</span><b>${w}</b></div><div><span class="lab">Median estimated wait</span><b>${md} min</b></div><div><span class="lab">Active counters</span><b>${ac}<small class="mut"> / ${to}</small></b></div><div><span class="lab">Unresolved service issues</span><b>${un}</b></div></div>

dp(){if(S.sel2){const d=dep(S.sel2),al=alerts().filter(a=>a.l===d.n);return`<button class="btn" onclick="go('dp')">← All departments</button><div style="height:16px"></div>`+hd(d.n+' '+bg(d),e(d.loc)+' · Directions: follow signs from the main entrance to '+e(d.loc)+'.')+
`<div class="kpis"><div><span class="lab">Queue size</span><b>${wt(d).length}</b></div><div><span class="lab">Estimated waiting time</span><b>${E(est(d))}</b></div><div><span class="lab">Active counters</span><b>${d.a} / ${d.tot}</b></div><div><span class="lab">Slots left today</span><b>${d.wk-d.wu} walk-in · ${d.cap-d.wk-d.bk} online</b></div></div>

function decide(y){if(!adm())return;const d=dep(S.sel),R=S.rec.R;if(y){const o=d.wk;d.wk=R;S.hs.unshift({k:'alloc',t:S.t+4,x:`${d.n}: walk-in reserve ${o} → ${R} (approved)`});log(`Allocation approved for ${d.n}: walk-in reserve ${o} → ${R}`,d.c)}else{S.hs.unshift({k:'alloc',t:S.t+4,x:`${d.n}: recommendation (${R}) rejected`});log('Allocation recommendation rejected for '+d.n,d.c)}S.rec=null;render()}
function submitFb(){const t=$('#ft').value.trim();if(!t)return toast('Please add a short description');const id='FB-'+(1044+S.cm.length-3);S.cm.unshift({id,cat:$('#fc').value,loc:$('#fl').value,tx:t,an:$('#fa').checked?1:0,st:'Submitted',team:'',t0:S.t,t1:null,t2:null,nt:''});ref=id;log('Report '+id+' submitted ('+$('#fc').value+', '+$('#fl').value+')');render()}
function cmA(i,a){const c=S.cm[i];if(a==='a'){c.team=$('#tm'+i).value;c.st='Assigned';S.t+=4;c.t1=S.t;log(c.id+' assigned to '+c.team)}else if(a==='s'){c.st='In progress';log(c.id+' work started')}else{const n=$('#nt'+i).value.trim();if(!n)return toast('Add a resolution note first');c.nt=n;c.st='Resolved';S.t+=4;c.t2=S.t;log(c.id+' resolved')}render()}
function agent(){const bx=$('#agst');if(!bx||S.run)return;S.run=1;bx.hidden=false;const st=['Inspecting the current queue','Checking counter availability','Identifying the bottleneck','Drafting a proposal for approval'];let i=0;(function nx(){if(i<st.length){bx.innerHTML='<span class="mut">Step '+(i+1)+' of 4 · </span>'+st[i++];setTimeout(nx,520)}else{S.run=0;agent2()}})()}
function agent2(){const o=S.d.filter(d=>d.st!=='Closed'),m=o.reduce((a,b)=>(est(b)||0)>(est(a)||0)?b:a),w=est(m);
if(w<45){S.ag={t:'No bottleneck detected',ev:['Highest estimated wait is '+m.n+' at '+E(w)+', below the 45-minute threshold.'],as:[],pr:'No action proposed.',s:'No action'};return render()}
const av=m.tot-m.a;S.ag={d:m.c,t:'Bottleneck: '+m.n,ev:[wt(m).length+' patients waiting','Estimated waiting time '+E(w)+' ('+wt(m).length+' × '+m.avg+' min ÷ '+m.a+' counters)',m.a+' of '+m.tot+' counters active'],as:['Average service time stays at '+m.avg+' min','Unavailable counter can be staffed by the supervisor'],pr:av>0?'Ask the supervisor to activate 1 additional counter in '+m.n+'. Projected estimated waiting time: '+E(Math.round(wt(m).length*m.avg/(m.a+1)))+'.':'No spare counter. Create a task for the supervisor to review staffing.',s:'Pending approval',av};log('Agent analysis: '+m.n+' bottleneck detected ('+E(w)+')',m.c,1);render()}
function agDec(y){if(!adm())return;const a=S.ag,d=dep(a.d);if(!y){a.s='Rejected';S.hs.unshift({k:'agent',t:S.t,x:'Proposal for '+d.n+' rejected by administrator'});log('Agent proposal rejected for '+d.n,d.c);return render()}
const b=est(d);if(a.av>0)d.a++;else S.tk.push({id:'T-'+(14+S.tk.length),x:'Review staffing for '+d.n,o:'Supervisor',dn:0});a.s='Executed';a.out=a.av>0?'Counter activated. Estimated waiting time recalculated: '+E(b)+' → '+E(est(d))+'.':'Task created for supervisor.';S.hs.unshift({k:'agent',t:S.t+4,x:d.n+': '+a.out});log('Approved: '+a.pr.split('.')[0],d.c);render()}
function menu(){const m=$('#menu');m.innerHTML='<b>Demo staff user</b><br><span class="mut">'+S.role+'</span>';m.style.display=m.style.display=='block'?'none':'block'}
function hdr(){$('#hn').textContent=S.hn;$('#dt').textContent='· '+new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' · '+fm(S.t);$('#pf').textContent='Staff · '+S.role;$('#bell').textContent='Alerts '+alerts().length;$('#bell').onclick=()=>go('ov')}
var lp;function render(){const ch=lp!==page;lp=page;$('#nav').innerHTML='<div class="logo">Hospital<b>OS</b> AI</div><div class="tag">Better coordination. Less waiting.</div>'+NAV.map(n=>`<button class="${n[0]==page?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');const m=$('#main');m.innerHTML=P[page]();m.classList.toggle('anim',ch);m.querySelectorAll('tr').forEach((r,i)=>r.style.setProperty('--i',i));if(ch)countUp(m);hdr()}
function lamp(c,i){const d=dep(c);ctr(c,(i<d.a?i:i+1)-d.a)}
function countUp(m){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;m.querySelectorAll('.kpis b').forEach(b=>{const n=b.firstChild;if(!n||n.nodeType!==3)return;const x=n.nodeValue.match(/^(\d+)(.*)$/);if(!x)return;const T=+x[1],t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700);n.nodeValue=Math.round(T*(1-Math.pow(1-p,3)))+x[2];if(p<1)requestAnimationFrame(f)})(t0)})}
document.addEventListener('click',ev=>{const b=ev.target.closest('.btn');if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement('span');s.className='rip';s.style.left=ev.clientX-r.left+'px';s.style.top=ev.clientY-r.top+'px';b.appendChild(s);setTimeout(()=>s.remove(),600)});
document.addEventListener('mousemove',ev=>{const t=ev.target.closest('.kpis div,.tile');if(!t)return;const r=t.getBoundingClientRect();t.style.setProperty('--mx',ev.clientX-r.left+'px');t.style.setProperty('--my',ev.clientY-r.top+'px')});
(function(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const L=[...document.querySelectorAll('#px>svg')],D=[.04,.1,.2];let mx=0,my=0,tk=0;function u(){tk=0;const y=scrollY;L.forEach((l,i)=>l.style.translate=(-mx*D[i]*160)+'px '+(-y*D[i]*1.6-my*D[i]*100)+'px');const h=Math.min(y,360)*.18;document.querySelectorAll('#main>h1,#main>.sub').forEach(t=>t.style.translate='0 '+h+'px')}const r=()=>{tk=tk||requestAnimationFrame(u)};addEventListener('scroll',r,{passive:true});addEventListener('mousemove',ev=>{mx=ev.clientX/innerWidth-.5;my=ev.clientY/innerHeight-.5;r()});r()})();
render();
</script></body></html>
